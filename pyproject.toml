[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "supramolecular-search"
version = "0.1.0"
description = "Search for aromatic-ring interactions (anion-pi, cation-pi, pi-pi, methyl-pi, ...) in PDB mmCIF files"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Michał Glanowski" }]
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.79",
    "networkx>=3.4",
    "numpy",
]

[project.optional-dependencies]
analysis = ["matplotlib", "pandas", "requests"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/chemiczny/PDB_supramolecular_search"

[tool.setuptools]
packages = ["supramolecular_search"]

[tool.setuptools.package-data]
supramolecular_search = ["anion_templates/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "N"]

[tool.ruff.lint.per-file-ignores]
# configure() runs before third-party imports so that "externalLibsPath" from
# config.json is on sys.path when they are imported.
"supramolecular_search/cif_analyser.py" = ["E402"]
"supramolecular_search/anion_recogniser.py" = ["E402"]
"scripts/update_pdb.py" = ["E402"]
# Imports follow the sys.path setup; commented-out analysis variants are kept.
"scripts/sequence_analysis.py" = ["E402", "E501"]
# PyMOL loads the plugin through __init_plugin__, after the plugin directory is
# put on sys.path so its modules can import each other.
"pymol_plugin/supramolecular/__init__.py" = ["E402", "N807"]
# Old camelCase aliases kept for scripts recorded before the rename.
"pymol_plugin/supramolecular/simpleFilters.py" = ["N816", "N999"]
